[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "universal-device-mcp"
version = "0.2.0"
description = "Local-first MCP server for discovering, inspecting and communicating with electronic devices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Universal Device MCP contributors" }]
dependencies = [
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
usb = ["pyusb>=1.2"]
serial = ["pyserial>=3.5"]
bluetooth = ["bleak>=0.22"]
network = ["zeroconf>=0.132"]
hid = ["hidapi>=0.14"]
ios = ["pymobiledevice3>=4.0", "pyusb>=1.2"]
media = ["opencv-python-headless>=4.10", "sounddevice>=0.5", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
all = ["pyusb>=1.2", "pyserial>=3.5", "bleak>=0.22", "zeroconf>=0.132", "hidapi>=0.14",
       "pymobiledevice3>=4.0"]

[project.scripts]
universal-device-mcp = "universal_device_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_device_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

